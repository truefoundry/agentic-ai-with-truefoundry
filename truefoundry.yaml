name: resmed-support-agent-fastapi
type: service
image:
  type: build
  build_spec:
    type: dockerfile
    dockerfile_path: ./module11-agenticai_from_code_to_production/Dockerfile.fastapi
    build_context_path: ./module11-agenticai_from_code_to_production/
  # `build_source.branch_name` and `build_source.ref` will automatically be patched during deployment.
  build_source:
    ref: cfe1f82025a41a3e4b3f79d400b0d96bc29a5ff2
    type: git
    repo_url: https://github.com/truefoundry/agentic-ai-with-truefoundry
    branch_name: chintan-fix-create_react_agent-issue
env:
  LLM_MODEL: openai-main/gpt-4o-mini
  TFY_API_KEY: tfy-secret://tfy-eo:chintan-secrets:TFY-API-KEY
  LLM_GATEWAY_URL: https://gateway.truefoundry.ai
ports:
  - host: ml.tfy-eo.truefoundry.cloud
    path: /resmed-support-agent-fastapi-chintan-onboarding-ws-8000/
    port: 8000
    expose: true
    protocol: TCP
    app_protocol: http
replicas: 1
resources:
  node:
    type: node_selector
    capacity_type: spot
  cpu_limit: 0.5
  cpu_request: 0.2
  memory_limit: 500
  memory_request: 200
  ephemeral_storage_limit: 2000
  ephemeral_storage_request: 1000
auto_shutdown:
  wait_time: 600
workspace_fqn: tfy-ea-dev-eo-az:chintan-onboarding-ws
liveness_probe:
  config:
    path: /health-check
    port: 8000
    type: http
  period_seconds: 10
  timeout_seconds: 1
  failure_threshold: 3
  success_threshold: 1
  initial_delay_seconds: 0
allow_interception: false