services:
  # 1. FastAPI Agent Backend Service
  fastapi-agent:
    build:
      context: .
      dockerfile: Dockerfile.fastapi

    ports:
      - "8000:8000"

    # Pass LLM / tracing secrets into the container (ignored by .dockerignore at build time)
    env_file:
      - .env

    container_name: resmed_fastapi_agent

    volumes:
      - .:/app
      # Keep the Linux venv from the image; don't overwrite with the host macOS .venv
      - /app/.venv

    # python:slim has no curl; use Python for the health probe
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health-check')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 2. Streamlit Frontend Service
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    ports:
      - "8501:8000"

    volumes:
      - .:/app
      - /app/.venv

    environment:
      # Must use Compose service hostname, NOT localhost from .env
      AGENT_API_URL: http://fastapi-agent:8000

    depends_on:
      fastapi-agent:
        condition: service_healthy

    container_name: resmed_streamlit_app

networks:
  default:
    driver: bridge
