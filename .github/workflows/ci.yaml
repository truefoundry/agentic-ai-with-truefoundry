name: Agent CI - Quality Gates

on:
  # Triggers the workflow on push to any branch and on pull requests targeting main
  push:
    branches:
      - '**' # Run on all branches
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    # Define environment variables needed for the agent and evaluation script
    env:
      # These secrets are necessary for the LLM to run during the evaluation workflow
      TFY_API_KEY: ${{ secrets.TFY_API_KEY }} 
      LLM_MODEL: openai-main/gpt-4o-mini
      LLM_GATEWAY_URL: https://internal.devtest.truefoundry.tech/api/llm

    steps:
      - name: Checkout Repository
        # Checks out the code to the runner environment
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        # Sets up the correct Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'uv' # Optimizes package installation with uv caching

      - name: Install Dependencies
        run: |
          # Install uv globally
          pip install uv
          # Install all project dependencies using the lockfile
          # This includes pytest, pylint, langgraph, and evaluation dependencies
          uv sync --frozen

      - name: 🧹 Run Static Code Analysis (Pylint)
        # Quality Gate 1: Checks for structural errors and code style
        run: |
          echo "Running Pylint on src/ and tests/"
          # Execute pylint on your application code
          uv run pylint src/ tests/
        
      - name: 🧪 Run Unit and Integration Tests (Pytest)
        # Quality Gate 2: Checks code correctness and agent orchestration flow (mocked LLM)
        run: |
          echo "Running unit and integration tests..."
          # Execute pytest on all tests in the tests/ directory
          uv run pytest
        
      - name: 📊 Run Evaluation Workflow (MLOps Quality Check)
        # Quality Gate 3: Runs the expensive, real-world evaluation checks
        # This verifies safety, faithfulness, and functional stability against the LLM
        run: |
          echo "Running evaluation workflow against 50 scenarios..."
          # Execute your custom evaluation script
          uv run python evaluation/run_evaluation.py
        
      - name: 📦 Build Docker Images (Final Artifact Check)
        # This step verifies that the Dockerfiles are syntactically correct 
        # and ready for the CD process, tagging the image with the commit SHA.
        run: |
          docker build -t fastapi-agent:${{ github.sha }} -f Dockerfile.fastapi .
          docker build -t streamlit-app:${{ github.sha }} -f Dockerfile.streamlit .
