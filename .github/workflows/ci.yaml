name: Agent CI - Quality Gates

on:
  # Triggers the workflow on push to any branch and on pull requests targeting main
  push:
    branches:
      - '**' # Run on all branches
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    # Define environment variables needed for the agent and evaluation script
    env:
      TFY_API_KEY: ${{ secrets.TFY_API_KEY }} 
      LLM_MODEL: openai-main/gpt-4o-mini
      LLM_GATEWAY_URL: https://internal.devtest.truefoundry.tech/api/llm

    steps:
      - name: Checkout Repository
        # Checks out the code into the correct subdirectory
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        # Sets up the correct Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        # Use the working-directory key to execute the command inside the subfolder
        run: |
          # Install uv globally
          pip install uv
          # Install all project dependencies using the lockfile
          uv sync --frozen

      - name: Run Static Code Analysis (Pylint)
        # Quality Gate 1: Checks for structural errors and code style
        run: |
          echo "Running Pylint on src/ and tests/"
          # Execute pylint from the correct directory context
          uv run pylint --disable=E0401,C0413,W0718 module11-agenticai_from_code_to_production/src/ module11-agenticai_from_code_to_production/tests/
        
      - name: Run Unit and Integration Tests (Pytest)
        # Quality Gate 2: Checks code correctness and agent orchestration flow (mocked LLM)
        run: |
          echo "Running unit and integration tests..."
          # Execute pytest from the correct directory context
          uv run pytest module11-agenticai_from_code_to_production/tests/
        
      - name: Run Evaluation Workflow (LLMOps Quality Check)
        # Quality Gate 3: Runs the expensive, real-world evaluation checks
        run: |
          echo "Running evaluation workflow against 50 scenarios..."
          # Execute your custom script
          uv run python module11-agenticai_from_code_to_production/evaluation/run_evaluation.py
        
      # - name: Build Docker Images (Final Artifact Check)
      #   # This step verifies that the Dockerfiles are syntactically correct 
      #   # The build context is now relative to the subfolder.
      #   run: |
      #     docker build -t fastapi-agent:${{ github.sha }} -f module11-agenticai_from_code_to_production/Dockerfile.fastapi .
      #     docker build -t streamlit-app:${{ github.sha }} -f module11-agenticai_from_code_to_production/Dockerfile.streamlit .